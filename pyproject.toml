[project]
name = "rxn-smarts-embeddings"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "huggingface-hub>=0.20.0",
]

[project.optional-dependencies]
all = [
    "matplotlib>=3.10.8",
    "pillow>=12.2.0",
    "pandas>=2.3.3",
    "rdkit>=2025.9.6",
    "scikit-learn>=1.6.1",
    "sentencepiece>=0.2.0",
    "umap-learn>=0.5.0",
    "ipykernel>=7.2.0",
]

[project.scripts]
smarts-embed = "rxn_smarts_embeddings.predict:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=6.0.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rxn_smarts_embeddings"]