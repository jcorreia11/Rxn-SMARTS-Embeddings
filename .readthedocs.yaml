version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  commands:
    - pip install uv
    # --only-group: mkdocstrings/griffe do pure static analysis (no runtime
    # imports), so the project's own base deps (torch + CUDA stack, ~2.5GB)
    # aren't needed to build docs — verified empirically. --no-sync below
    # is required: plain `uv run` re-syncs to the default group set first,
    # silently reinstalling torch and defeating this entirely.
    - uv sync --only-group docs
    - uv run --no-sync mkdocs build --strict --site-dir $READTHEDOCS_OUTPUT/html