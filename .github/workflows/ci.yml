name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uvx ruff@0.15.5 check src/ tests/

      - name: Format check
        run: uvx ruff@0.15.5 format --check src/ tests/

      - name: Run tests
        run: uv run pytest --cov=src/rxn_smarts_embeddings --cov-report=term-missing --cov-fail-under=90 -v