name: Dependency Review

on:
  pull_request:
    branches: [main, dev]

jobs:
  dependency-review:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen --extra all

      - name: Audit dependencies for known vulnerabilities
        # CVE-2026-4539: pygments 2.19.2, no patched release available yet.
        # Remove --ignore-vuln once a patched version is released.
        # --extra all: audit the full dependency surface (preprocessing/training/
        # evaluation/visualisation extras), not just the minimal base install.
        # VCS git-sourced deps are stripped before auditing because pip-audit
        # cannot hash them and fails at the install stage before --skip-editable applies.
        # torch/torchvision/torchaudio are sourced from download.pytorch.org (CUDA builds)
        # and are not resolvable by pip-audit's internal pip against PyPI. Their bundled
        # CUDA toolkit components (nvidia-*-cu12, triton) are stripped for the same reason
        # and are multi-hundred-MB downloads with no independently tracked CVEs.
        run: uvx --python 3.11 pip-audit --requirement <(uv export --no-dev --no-emit-project --extra all --format requirements-txt | grep -v ' @ git+' | grep -vE '^torch(vision|audio)?==' | grep -vE '^(nvidia-|triton==)') --ignore-vuln CVE-2026-4539